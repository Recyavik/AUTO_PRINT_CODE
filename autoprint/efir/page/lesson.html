<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экран урока — AutoPrintCode</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg:#1B1B1F; --panel:#232329; --card:#2A2A31; --card2:#32323A; --stroke:rgba(255,255,255,.075);
  --stroke2:rgba(255,255,255,.16); --text:#F4F4F7; --text2:#E4E4EA; --dim:#A6A6B2; --faint:#8A8A96;
  --accent:#E9A72C; --accent-soft:rgba(233,167,44,.13); --accent-line:rgba(233,167,44,.5); --on-accent:#1B1B1F;
  --ok:#3FB950; --ok-text:#6FD382; --ok-soft:rgba(63,185,80,.14); --live:#F2686C; --imp:#FF8A8D;
  --say:#7FB4FF; --tell:#6FD382; --ask:#E9A72C; --ask-ans:#E9C77F; --do:#C9C9D2; --do-text:#B9B9C4;
  --show:#B28CFF; --trap:#F2686C; --extra:#B28CFF; --image:#6FC3DF; --term:#5FC9B8; --output:#6FD382;
  --code-bg:#1F1F24; --code-fg:#E6E6EC; --chip-bg:rgba(255,255,255,.92); --menu:#2C2C34; --shadow:0 12px 32px rgba(0,0,0,.45);
  --t-c:#8A8A96; --t-k:#F0B54A; --t-b:#6FC3DF; --t-f:#7FB4FF; --t-cl:#F2CC60; --t-d:#F2CC60; --t-t:#F2686C;
  --t-a:#E8A87C; --t-s:#9CD67C; --t-n:#D2A8FF; --t-o:#A6A6B2;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
body.light {
  --bg:#EDEDF1; --panel:#F6F6F9; --card:#FFFFFF; --card2:#F0F0F4; --stroke:rgba(0,0,0,.08); --stroke2:rgba(0,0,0,.18);
  --text:#16161A; --text2:#26262C; --dim:#5A5A66; --faint:#6E6E7A; --accent:#B87400; --accent-soft:rgba(184,116,0,.10);
  --accent-line:rgba(184,116,0,.45); --on-accent:#FFFFFF; --ok:#237A32; --ok-text:#237A32; --ok-soft:rgba(35,122,50,.10);
  --live:#C0272D; --imp:#C0272D; --say:#1F5FBF; --tell:#237A32; --ask:#B87400; --ask-ans:#8A5A00; --do:#5A5A66;
  --do-text:#4A4A55; --show:#7A3DB8; --trap:#C0272D; --extra:#7A3DB8; --image:#0F7A99; --term:#0E7C6E; --output:#237A32;
  --code-bg:#F7F7FA; --code-fg:#16161A; --chip-bg:#FFFFFF; --menu:#FFFFFF; --shadow:0 12px 32px rgba(0,0,0,.16);
  --t-c:#6E6E7A; --t-k:#A35F00; --t-b:#0F7A99; --t-f:#1F5FBF; --t-cl:#8A5A00; --t-d:#8A5A00; --t-t:#C0272D;
  --t-a:#A0522D; --t-s:#237A32; --t-n:#7A3DB8; --t-o:#5A5A66;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--ui); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: 600 14px var(--ui); color: var(--text); cursor: pointer; min-height: 40px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--stroke2); background: var(--card); }
button:hover { border-color: var(--accent-line); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.ghost { background: transparent; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
code { font-family: var(--mono); font-size: .92em; background: var(--card2); border-radius: 5px; padding: 1px 5px; }
[hidden] { display: none !important; }

/* ---------------- шапка */
header { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--stroke); }
.brand { display: flex; align-items: center; gap: 12px; flex: 1 1 320px; min-width: 0; }
.logo img { display: block; width: 36px; height: 36px; border-radius: 10px; }
.kicker { font-size: 12px; color: var(--dim); font-weight: 600; }
h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.25; display: flex; align-items: center; gap: 4px; min-width: 0; }
#titleText { overflow-wrap: anywhere; border-radius: 6px; padding: 0 2px; margin-left: -2px; }
body.mode-prep #titleText { cursor: text; }
body.mode-prep #titleText:hover { background: var(--card); }
#lessonsBtn { min-height: 28px; height: 28px; width: 28px; padding: 0; border: none; background: transparent; color: var(--dim);
  display: inline-flex; align-items: center; justify-content: center; flex: none; }
#lessonsBtn:hover { background: var(--card); color: var(--text); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border-radius: 999px;
  background: var(--card); color: var(--dim); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.ok { background: var(--ok-soft); color: var(--ok-text); }
.chip.warn { background: var(--accent-soft); color: var(--accent); }
.chip.save { background: transparent; padding: 0 4px; font-size: 13px; }
.chip .tm { font: inherit; color: var(--text); background: transparent; border: none; width: 6.2em; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.seg { display: inline-flex; border: 1px solid var(--stroke2); border-radius: 10px; overflow: hidden; }
.seg button { border: none; border-radius: 0; background: transparent; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--stroke2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; }
.iconbtn.only { padding: 0 9px; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
.ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#legend { background: var(--panel); border-bottom: 1px solid var(--stroke); padding: 14px 24px; }
#legend .grid { max-width: 1312px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px 20px; font-size: 14px; color: var(--dim); }
#legend .grid div { display: flex; align-items: center; gap: 10px; }
#legend .grid .ic { width: 28px; height: 28px; border-radius: 8px; color: var(--rc); background: color-mix(in srgb, var(--rc) 14%, transparent); }
#legend b { color: var(--text); }

/* ---------------- раскладка */
#wrap { max-width: 1380px; margin: 0 auto; padding: 20px 24px 96px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
nav#plan { flex: 1 1 260px; min-width: 0; max-width: 100%; background: var(--panel); border: 1px solid var(--stroke);
  border-radius: 14px; padding: 14px; position: sticky; top: calc(var(--hh, 64px) + 12px); max-height: calc(var(--vh, 1vh) * 100 - var(--hh, 64px) - 28px); overflow: auto; }
main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

/* план */
.ptitle { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 6px; }
.ptitle h2 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.ptitle span { font-size: 13px; color: var(--dim); font-weight: 600; }
.ptitle .ppin { font-size: 12px; margin-left: 8px; white-space: nowrap; }
.ptitle .ptotal { margin-left: auto; }
body.mode-prep .ptitle .ppin, body.plan-hidden .ptitle .ppin { display: none; }   /* настройка — только для «Урока» */
.ppart { font-size: 12px; font-weight: 700; color: var(--dim); margin: 12px 8px 4px; }
.prow { padding: 5px 6px; border: 1px solid transparent; border-radius: 8px; }
.prow:hover { background: var(--card); border-color: var(--stroke); }
.prow .line { display: flex; gap: 8px; align-items: center; }
.prow .t { width: 38px; flex: none; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--dim); }
.prow .n { flex: 1; min-width: 0; text-align: left; min-height: 0; padding: 2px 0; border: none; background: none;
  font: 400 14px/1.35 var(--ui); color: inherit; overflow-wrap: anywhere; }
.prow .ic svg { width: 14px; height: 14px; color: var(--accent); }
.prow .m { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
.prow .pmin { display: none; width: 3.2em; font: 600 13px var(--ui); color: var(--text); background: var(--card);
  border: 1px solid var(--stroke2); border-radius: 6px; padding: 3px 6px; text-align: right; font-variant-numeric: tabular-nums; }
body.mode-prep .prow .pmin { display: block; }
body.mode-prep .prow .m { display: none; }
body.mode-prep .prow .m.fixed { display: inline; }      /* урок по плану: минуты — из плана, без поля */
body.mode-prep .prow[draggable="true"] { cursor: grab; }
.prow.past { color: var(--faint); }
.prow.past .n { text-decoration: line-through; }
.prow.current { background: var(--accent-soft); border-color: var(--accent-line); }
.prow.current .t { color: var(--accent); font-weight: 800; }
.prow.current .n { font-weight: 700; }
.prow.ending { border-color: var(--live); }
.prow.has-armed .t::after { content: "▶"; color: var(--accent); font-size: 9px; margin-left: 3px; vertical-align: 1px; }
.prow .pbar2 { height: 4px; border-radius: 2px; background: var(--stroke2); margin: 6px 0 0 46px; display: none; }
.prow.current .pbar2 { display: block; }
.prow .pbar2 i { display: block; height: 4px; border-radius: 2px; background: var(--accent); width: 0; }
.prow.drop-above { box-shadow: 0 -2px 0 var(--accent); }
.prow.drop-below { box-shadow: 0 2px 0 var(--accent); }
.prow.dragging { opacity: .45; }
.phint { margin: 12px 8px 0; font-size: 13px; color: var(--dim); }

/* этап */
.stage, .intro { background: var(--card); border: 1px solid var(--stroke); border-radius: 16px; overflow: hidden; scroll-margin-top: calc(var(--hh, 64px) + 12px); }
.intro { background: var(--panel); }
.intro .introh { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 12px 20px 0; }
.intro:not(.has-stages) .introh { display: none; }
.intro > .bar { display: none !important; }
.stage.current { border-color: var(--accent-line); }
.stage.ending { border-color: var(--live); }
.sh { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 20px; }
body.mode-lesson .sh { cursor: pointer; }
.stage.current .sh { background: var(--accent-soft); }
.clock { background: var(--card2); color: var(--text); font-weight: 800; font-size: 15px; border-radius: 8px; padding: 5px 10px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.stage.current .clock { background: var(--accent); color: var(--on-accent); }
.clock small { font-weight: 600; opacity: .75; margin-left: 6px; font-size: 12px; }
.sht { flex: 1 1 240px; min-width: 0; }
.meta { font-size: 14px; color: var(--dim); font-weight: 600; }
.sht h2 { margin: 2px 0 0; font-size: 21px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
body.mode-prep .sht h2 { cursor: text; border-radius: 6px; }
body.mode-prep .sht h2:hover { background: var(--card2); }
.stage.current .sht h2 { font-size: 24px; }
.sedit { display: none; align-items: center; gap: 6px; }
body.mode-prep .sedit { display: flex; }
.sedit button { min-height: 32px; height: 32px; padding: 0 9px; background: transparent; }
.sedit .mins { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2.6em; }
.sedit .minsu { font-size: 13px; color: var(--dim); margin-right: 6px; }
.sedit .kindbtn.on { color: var(--accent); border-color: var(--accent-line); }
/* урок по плану: этапы и минуты — из плана, здесь только видно */
.sedit .mins.fixed { display: inline-flex; align-items: center; justify-content: flex-end; color: var(--dim); }
.sedit .kindbtn:disabled { opacity: .45; cursor: default; }
#planlink { min-height: 0; padding: 0; margin-top: 2px; border: none; background: none; color: var(--accent);
  font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; }
#planlink:hover { text-decoration: underline; }
#planbanner { margin: 14px 24px 0; padding: 12px 16px; border: 1px solid var(--accent-line); border-radius: 12px;
  background: var(--panel); font-size: 14px; line-height: 1.5; }
#planbanner b { font-weight: 700; }
#planbanner .linkbtn { margin: 0 2px; }
#planbanner small { display: block; color: var(--dim); font-size: 13px; margin-top: 2px; }
.left { text-align: right; }
body.mode-prep .left { display: none; }
.left .lbl2 { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.stage.current .left .lbl2 { color: var(--accent); }
.stage.ending .left .lbl2, .stage.ending .left .big { color: var(--live); }
.left .big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stage.current .left .big { font-size: 32px; }
.bar { height: 4px; background: var(--stroke); display: none; }
.stage.current .bar { display: block; }
.bar i { display: block; height: 4px; background: var(--accent); width: 0; }
.body { padding: 2px 20px 12px; }
.stage.collapsed .body, .stage.collapsed .bar { display: none; }
.stage.collapsed .sh { padding: 12px 20px; }
.stage.collapsed .sht h2 { font-size: 16px; }
.stage.past.collapsed { opacity: .72; }
body.mode-lesson .stage.past:not(.collapsed) { opacity: .78; }
body.mode-lesson .stage.past:not(.collapsed):hover { opacity: 1; }
#nowbar { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 70; min-height: 40px; padding: 0 18px;
  border-radius: 999px; background: var(--accent); color: var(--on-accent); border: none; font-weight: 700; font-size: 15px;
  box-shadow: var(--shadow); cursor: pointer; }
.empty-stage { color: var(--dim); font-size: 14px; padding: 10px 0; }
.hello { background: var(--panel); border: 1px dashed var(--stroke2); border-radius: 16px; padding: 40px 24px; text-align: center; color: var(--dim); font-size: 16px; }

/* ---------------- блоки: плашки ролей, как в PDF-суфлёре */
.blk { position: relative; border-radius: 10px; }
.row { --rc: var(--faint); position: relative; margin: 8px 0; padding: 9px 16px 11px; border-radius: 10px;
  border-left: 4px solid var(--rc); background: color-mix(in srgb, var(--rc) 9%, transparent); }
.lbl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11.5px; font-weight: 800;
  letter-spacing: .07em; text-transform: uppercase; color: var(--rc); min-height: 20px; }
.lbl .ic svg { width: 15px; height: 15px; }
.lbl .sub { opacity: .85; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 700; }
.lbl .addtitle { display: none; text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; color: var(--faint); cursor: pointer; }
body.mode-prep .blk:hover .lbl .addtitle { display: inline; }
body.mode-prep .blk[data-type="markdown"] .rname { cursor: pointer; border-bottom: 1px dashed transparent; }
body.mode-prep .blk[data-type="markdown"] .rname:hover { border-bottom-color: currentColor; }
body.mode-prep .lbl .sub { cursor: text; }
.r-say { --rc: var(--say); }
.r-term { --rc: var(--term); }
.r-tell { --rc: var(--tell); }
.r-ask { --rc: var(--ask); }
.r-do { --rc: var(--do); background: color-mix(in srgb, var(--do) 7%, transparent); }
.r-output { --rc: var(--output); background: color-mix(in srgb, var(--output) 6%, transparent); }
.r-important { --rc: var(--imp); background: color-mix(in srgb, var(--imp) 13%, transparent); }
.r-show { --rc: var(--show); }
.r-trap { --rc: var(--trap); background: color-mix(in srgb, var(--trap) 7%, transparent); }
.r-extra { --rc: var(--extra); background: transparent; border: 1px dashed color-mix(in srgb, var(--rc) 55%, transparent); border-left: 4px dashed var(--rc); }
.r-task { --rc: var(--accent); }
.r-explain { --rc: var(--say); }
.r-hint { --rc: var(--show); }
.r-homework { --rc: var(--accent); }
.toscreen { margin-left: 10px; min-height: 26px; padding: 0 10px; font-size: 12px; border-radius: 999px; text-transform: none;
  letter-spacing: 0; background: transparent; color: var(--dim); }
.toscreen:hover { color: var(--text); border-color: var(--accent-line); }
.blk.onscreen .r-image figure { box-shadow: 0 0 0 3px var(--accent); border-radius: 10px; }
/* «Урок» на ноутбуке: слайд не выше 40% экрана — заметки к нему видны сразу под ним */
body.mode-lesson .r-image figure img { max-height: min(calc(var(--vh, 1vh) * 40), 520px); }
.blk[data-id] { scroll-margin-top: calc(var(--hh, 64px) + 12px); }
.blk.onscreen .toscreen { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.r-goal { --rc: var(--say); }
.lbl .how { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; color: var(--dim); }
.r-text { background: transparent; border-left-color: var(--stroke2); }
.r-code, .r-image { --rc: var(--dim); background: transparent; border-left-color: transparent; padding-left: 0; padding-right: 0; }
.r-image { --rc: var(--image); }
.c { min-width: 0; font-size: 15px; line-height: 1.55; color: var(--text2); overflow-wrap: anywhere; }
.c p { margin: 0 0 6px; } .c p:last-child { margin-bottom: 0; }
.c ul, .c ol { margin: 0; padding-left: 20px; }
.c h2, .c h3, .c h4, .c h5, .c h6 { margin: 0 0 4px; font-size: 16px; }
.c pre { margin: 6px 0; padding: 10px 12px; border-radius: 8px; background: var(--code-bg); color: var(--code-fg);
  font: 13px/1.5 var(--mono); overflow-x: auto; }
.c.empty { color: var(--faint); font-style: italic; }
.r-say .c { font-size: 18px; color: var(--text); font-weight: 500; }
.r-term .c { color: var(--text); }
.r-term .term { font-size: 19px; font-weight: 800; color: var(--text); }
.r-term .def { font-size: 16px; }
.r-tell .c { font-size: 16px; color: var(--text); }
.r-ask .q { font-size: 18px; font-weight: 600; color: var(--text); }
.r-ask .ans { margin-top: 4px; font-size: 15px; color: var(--ask-ans); }
.r-do .c { color: var(--do-text); font-size: 14.5px; }
.r-output .c { font: 14px/1.55 var(--mono); color: var(--text); white-space: pre-wrap; }
.r-output .c pre { margin: 0; padding: 0; background: none; font: inherit; }
.r-output .c p { margin: 0; }
.r-important .c { color: var(--imp); font-weight: 700; font-size: 16px; }
.r-extra .c { color: var(--dim); }
.r-trap .c li::marker { color: var(--trap); }
/* правка заметки «как в Word» — то же поле, тот же шрифт: блок не прыгает; разметки не видно */
.ned .rich { outline: none; min-height: 1.55em; caret-color: var(--accent); cursor: text; }
.ned .rich:empty::before { content: attr(data-placeholder); color: var(--faint); font-style: italic; font-weight: 400; }
.ned .rich a { color: var(--accent); }
.r-ask .ned .rich { font-size: 18px; font-weight: 600; color: var(--text); }
.r-term .ned .rich { font-size: 16px; }
.ned .termin { display: block; width: 100%; margin: 0 0 2px; padding: 0; border: none; outline: none; background: transparent;
  font: 800 19px/1.4 var(--ui); color: var(--text); }
.ned .termin::placeholder, .ned .ansin::placeholder { color: var(--faint); font-weight: 400; font-style: italic; }
.ansed { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.ansrow { display: flex; align-items: center; gap: 6px; }
.ansrow .arr { color: var(--ask-ans); font-size: 15px; }
.ansin { flex: 1; min-width: 0; padding: 2px 0; border: none; border-bottom: 1px dashed var(--stroke2); outline: none;
  background: transparent; font: 15px/1.55 var(--ui); color: var(--ask-ans); }
.ansin:focus { border-bottom-color: var(--accent); }
.ansdel { min-height: 24px; padding: 0 6px; border: none; background: transparent; color: var(--faint); }
.addans { align-self: flex-start; min-height: 26px; margin-top: 2px; padding: 0 10px; font-size: 13px; background: transparent; color: var(--dim); }
.blk > .rtb { position: absolute; top: 2px; right: 8px; z-index: 6; display: flex; flex-wrap: wrap; gap: 2px; padding: 3px;
  border-radius: 9px; background: var(--menu); border: 1px solid var(--stroke2); box-shadow: var(--shadow); }
.rtb button { min-height: 26px; padding: 0 9px; font-size: 13px; border: none; border-radius: 6px; background: transparent; color: var(--text2); }
.rtb button:hover { background: var(--card2); color: var(--text); }
.rtb .rt-bold { font-weight: 900; } .rtb .rt-italic { font-style: italic; font-family: Georgia, serif; }
.rtb .rt-code { font-family: var(--mono); }
.blk.editing .row { box-shadow: 0 0 0 1px var(--accent-line) inset; }

/* код */
.r-code .armslot { margin-left: 8px; text-transform: none; letter-spacing: 0; }
.armed-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft);
  color: var(--accent); font-size: 12px; font-weight: 700; }
.armbtn { min-height: 26px; padding: 0 10px; font-size: 12px; border-radius: 999px; background: transparent; color: var(--dim); }
.say { margin: 2px 0 8px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--say) 12%, transparent);
  border-left: 3px solid var(--say); font-size: 16px; white-space: pre-wrap; color: var(--text); }
.say b { color: var(--say); }
.codebox { position: relative; display: flex; border-radius: 10px; background: var(--code-bg); border: 1px solid var(--stroke); overflow: hidden; }
.blk.armed .codebox { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
.codebox .gut { flex: none; padding: 12px 8px 12px 10px; font: 14px/21px var(--mono); color: var(--faint); text-align: right;
  user-select: none; border-right: 1px solid var(--stroke); min-width: 2.6em; }
.codebox .gut .ln, .cm-gutterElement .ln { display: block; white-space: nowrap; }
.codebox .gut .ln b, .cm-gutterElement .ln b { display: inline-block; min-width: 1.3em; margin-right: 6px; padding: 0 3px;
  border-radius: 4px; background: color-mix(in srgb, var(--sc) 22%, transparent); color: var(--sc); font-weight: 800; text-align: center; }
.codebox pre { flex: 1; min-width: 0; margin: 0; padding: 12px 120px 12px 14px; color: var(--code-fg); font: 14px/21px var(--mono);
  overflow-x: auto; white-space: pre; }
.codebox pre.empty { color: var(--faint); font-style: italic; font-family: var(--ui); }
body.mode-prep .codebox { cursor: text; }
.codebox.editing > .gut, .codebox.editing > pre, .codebox.editing > .hls { display: none; }
.cmhost { flex: 1; min-width: 0; }
.cmhost .cm-editor { background: transparent; color: var(--code-fg); font: 14px/21px var(--mono); }
.cmhost .cm-editor.cm-focused { outline: none; }
.cmhost .cm-content { padding: 12px 120px 12px 14px; font: 14px/21px var(--mono); caret-color: var(--accent); }
.cmhost .cm-line { padding: 0; }
.cmhost .cm-gutters { background: transparent; border-right: 1px solid var(--stroke); color: var(--faint); }
.cmhost .cm-gutterElement { padding: 0 8px 0 10px !important; text-align: right; font: 14px/21px var(--mono); }
.cmhost .cm-gutter.gutx { padding-top: 12px; min-width: 2.6em; }
.cmhost .cm-selectionBackground, .cmhost .cm-focused .cm-selectionBackground { background: color-mix(in srgb, var(--accent) 28%, transparent) !important; }
.cmhost .cm-cursor { border-left-color: var(--accent); }
.lang { position: absolute; top: 8px; right: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  font-weight: 600; color: var(--dim); background: var(--code-bg); padding-left: 6px; font-family: var(--ui); }
.lang .li { width: 22px; height: 22px; border-radius: 6px; background: var(--chip-bg); display: inline-flex; align-items: center;
  justify-content: center; box-shadow: 0 0 0 1px var(--stroke); }
.lang .li img { width: 16px; height: 16px; display: block; }
.hls { position: absolute; inset: 0; pointer-events: none; }
.hl { position: absolute; left: 0; right: 0; height: 21px; background: color-mix(in srgb, var(--accent) 16%, transparent);
  border-left: 3px solid var(--accent); }
.pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.pbar i { display: block; height: 3px; background: var(--accent); width: 0; transition: width .2s linear; }
.selnote { margin-top: 6px; font-size: 13px; color: var(--accent); }
.linkbtn { min-height: 0; padding: 0; border: none; background: none; color: var(--accent); font-weight: 600; text-decoration: underline;
  text-underline-offset: 3px; }
.t-c { color: var(--t-c); font-style: italic; } .t-k { color: var(--t-k); } .t-b { color: var(--t-b); } .t-f { color: var(--t-f); }
.t-cl { color: var(--t-cl); font-weight: 600; } .t-d { color: var(--t-d); } .t-t { color: var(--t-t); } .t-a { color: var(--t-a); }
.t-s { color: var(--t-s); } .t-n { color: var(--t-n); } .t-o { color: var(--t-o); }

/* картинки */
figure { margin: 0; }
figure img { display: block; max-width: 100%; max-height: 520px; border-radius: 10px; border: 1px solid var(--stroke2);
  cursor: zoom-in; background: var(--card2); }
.missing { font-size: 14px; color: var(--dim); border: 1px dashed var(--stroke2); border-radius: 10px; padding: 12px 14px; }
/* место для картинки: «Слайд 5 — картинки нет», «Нужна картинка: кот у ноутбука» */
.placebox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border-color: var(--accent-line); }
.placebox .ptxt { font-weight: 600; color: var(--text); flex: 1 1 220px; }
.placebox .pacts { display: flex; flex-wrap: wrap; gap: 8px; }
.placebox button { min-height: 32px; height: 32px; padding: 0 12px; font-size: 13px; }

/* перерыв и зарядка на этапе */
.blk.efir .row { margin-top: 6px; }
.efirbtn { margin-top: 4px; }
.efirnote { display: inline-block; font-size: 13px; color: var(--dim); margin: 4px 0 0 8px; }

/* ---------------- «Подготовка»: ручка, ⋯, «+» — только при наведении */
.tools { }
.blk > .tools { position: absolute; top: 6px; display: none; }
body.mode-prep .blk[data-id] > .tools { display: flex; left: -44px; right: auto; gap: 2px; flex-direction: column; opacity: 0; transition: opacity .12s; }
body.mode-prep .blk[data-id]:hover > .tools, body.mode-prep .blk.sel > .tools { opacity: 1; }
.blk > .tools button { min-height: 22px; height: 22px; width: 22px; padding: 0; border: none; background: transparent; color: var(--faint);
  display: flex; align-items: center; justify-content: center; border-radius: 5px; }
.blk > .tools button:hover { background: var(--card2); color: var(--text); }
.blk > .tools .ic svg { width: 15px; height: 15px; }
.blk > .tools .grip { cursor: grab; }
body.mode-prep .body { padding-left: 52px; }
body.mode-prep .blk.sel .row { box-shadow: 0 0 0 1px var(--stroke2) inset; }
body.mode-prep .blk.dragging { opacity: .4; }
.blk.drop-before::before, .blk.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); }
.blk.drop-before::before { top: -2px; } .blk.drop-after::after { bottom: -2px; }
body.mode-lesson .blk.is-empty { display: none; }
.ins { display: none; position: relative; height: 10px; margin: -4px 0; }
body.mode-prep .ins { display: block; }
.ins .insbtn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; min-height: 24px;
  padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; background: var(--panel); color: var(--accent);
  border-color: var(--accent-line); transition: opacity .12s; z-index: 2; }
.ins .insbtn .ic svg { width: 14px; height: 14px; }
.ins::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--accent-line); opacity: 0; transition: opacity .12s; }
.ins:hover .insbtn, .ins:hover::before, .ins:focus-within .insbtn { opacity: 1; }
.body > .ins:only-child, .body > .ins:first-child:nth-last-child(2) { height: 22px; }
.body > .ins:only-child .insbtn, .body > .ins:only-child::before { opacity: .7; }
input.inl { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--accent-line); border-radius: 6px; padding: 2px 6px; min-width: 0; }
input.inl-title { font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 700; width: 18em; }
input.inl-stage { font: 800 21px/1.25 var(--ui); width: 100%; margin-top: 2px; }
input.inl-min { width: 3.4em; font-weight: 700; text-align: right; }
input.inl-h1 { font: 800 20px/1.25 var(--ui); width: min(32em, 60vw); }

/* меню и всплывающие окна */
.menu { position: fixed; z-index: 100; min-width: 220px; max-width: min(420px, calc(100vw - 16px)); max-height: calc(100vh - 16px); overflow: auto;
  background: var(--menu); border: 1px solid var(--stroke2); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.menu.wide { width: 340px; }
.menu.roles { width: 330px; }
.menu.lessons { width: 380px; }
.menu .mi { display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 34px; padding: 6px 10px; border: none; border-radius: 8px;
  background: transparent; font-weight: 500; text-align: left; }
.menu .mi:hover, .menu .mi:focus-visible { background: var(--card2); outline: none; }
.menu .mi.on .ml { font-weight: 800; }
.menu .mi.on::after { content: "✓"; margin-left: auto; color: var(--accent); }
.menu .mi.danger { color: var(--live); }
.menu .ml { flex: none; }
.menu .mh { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .mdot { width: 10px; height: 10px; border-radius: 3px; background: var(--rc); flex: none; align-self: center; }
.menu .mhead { font-size: 12px; font-weight: 700; color: var(--dim); padding: 8px 10px 4px; }
.menu .msep { height: 1px; background: var(--stroke); margin: 5px 4px; }
.menu .newl { align-items: center; color: var(--accent); font-weight: 700; }
.lsearch { padding: 4px; }
.lsearch input { width: 100%; padding: 8px 10px; border-color: var(--stroke2); }
.llist { max-height: calc(var(--vh, 1vh) * 50); overflow: auto; margin-top: 6px; }
.llist .mi { flex-direction: column; align-items: flex-start; gap: 0; }
.llist .mi.on::after { display: none; }
.pmenu { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 10px; }
.pmenu .seg button { flex: 1; }
.pmenu .seg { display: flex; }
.phelp { font-size: 12.5px; color: var(--dim); }
.prange { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.prange input { flex: 1; accent-color: var(--accent); }
.prange b { font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: right; }
.prange .u { font-size: 12px; color: var(--dim); }
.ptog { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.ptog input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }
.ptog small { display: block; color: var(--dim); font-size: 12px; }
.askbox { padding: 4px; } .askbox input { width: 100%; margin-top: 4px; padding: 6px 8px; }

#viewer { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.86); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; padding: 24px; cursor: zoom-out; }
#viewer img { max-width: 100%; max-height: calc(var(--vh, 1vh) * 100 - 90px); border-radius: 8px; }
#viewer .cap { color: #EEE; font-size: 15px; }
#offline { position: fixed; right: 16px; bottom: 16px; z-index: 60; padding: 10px 14px; border-radius: 10px; background: var(--live); color: #fff; font-weight: 600; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 12px;
  padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--menu); border: 1px solid var(--stroke2); box-shadow: var(--shadow); font-size: 14px; }
#toast button { min-height: 32px; }

/* ---------------- окно «Ответ нейросети» */
.modal { position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.45); padding: 16px; }
.mbox { width: min(720px, 100%); background: var(--menu); border: 1px solid var(--stroke2); border-radius: 14px;
  box-shadow: var(--shadow); padding: 18px; }
.mbox h3 { margin: 0 0 6px; font-size: 18px; }
.ansta { width: 100%; min-height: 240px; resize: vertical; margin: 10px 0; padding: 10px; border-radius: 10px;
  border: 1px solid var(--stroke2); background: var(--card); color: var(--text); font: 13px/1.5 var(--mono); }
.mrow { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------------- экран учеников */
.scrchip { cursor: pointer; font-weight: 700; }
.scrchip.dim { color: var(--dim); }
.scrchip.warn { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.scrchip.bad { background: color-mix(in srgb, #f2686c 18%, transparent); border-color: #f2686c; color: #f2686c; font-weight: 700; }

/* ---------------- план строкой (в «Уроке») */
#strip { flex: 1 1 100%; display: none; align-items: center; gap: 6px 10px; flex-wrap: wrap; min-width: 0; }
body.mode-lesson #strip, body.mode-prep.is-live #strip { display: flex; }
body.mode-prep #strip :is(.prev, .cur, .next, .end, .more) { display: none !important; }   /* в «Подготовке» план — слева */
body.mode-lesson:not(.plan-strip) #strip :is(.prev, .cur, .next, .end, .more), #strip.noplan :is(.prev, .cur, .next, .end, .more) { display: none !important; }
#strip .screen { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#status { cursor: default; }
body.mode-lesson #status.ok { cursor: pointer; }
.tmin { font: 600 15px var(--ui); color: var(--text); background: var(--card); border: 1px solid var(--stroke2); border-radius: 8px;
  padding: 4px 8px; }
#strip button { min-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 15px; }
#strip .prev, #strip .next { background: transparent; color: var(--dim); max-width: 26ch; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
#strip .cur { background: var(--accent-soft); border-color: var(--accent-line); font-weight: 800; color: var(--text);
  font-variant-numeric: tabular-nums; }
#strip .end { color: var(--dim); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
#strip .more { margin-left: 0; }
body.mode-lesson.plan-strip nav#plan, body.mode-lesson.plan-hidden nav#plan { display: none; }
/* «План ▾» — сбоку, как в «Подготовке»: текст сдвигается вправо, а не закрывается планом */
body.mode-lesson.plan-strip.plan-open nav#plan { display: block; }
#strip .more[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); }

/* ---------------- «Мои настройки» */
.prefsbtn { font-weight: 800; letter-spacing: -.02em; min-width: 40px; }
.prefs .zrow { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; }
.prefs .zrow > span { flex: 1; }
.prefs .zrow button { min-width: 36px; }
.prefs .zrow .zval { min-width: 4.2em; text-align: center; font-variant-numeric: tabular-nums; }
.prefs .mlabel { font-size: 13px; color: var(--dim); font-weight: 600; margin: 12px 0 6px; }

@media (max-width: 760px) {
  nav#plan { position: static; max-height: none; } header { padding: 10px 16px; } #wrap { padding: 16px; }
  body.mode-prep .body { padding-left: 20px; } body.mode-prep .blk[data-id] > .tools { left: auto; right: -8px; flex-direction: row; top: -6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print {
  body, body.light { --bg:#fff; --panel:#fff; --card:#fff; --card2:#F0F0F4; --text:#111; --text2:#222; --dim:#555; --faint:#666;
    --stroke:#ddd; --stroke2:#bbb; --code-bg:#F5F5F7; --code-fg:#111; --accent:#9A6200; --accent-soft:transparent;
    --say:#1F5FBF; --tell:#237A32; --ask:#9A6200; --ask-ans:#6B4400; --do:#555; --do-text:#444; --imp:#B00020; --trap:#B00020;
    --show:#6B2FB0; --extra:#6B2FB0; --term:#0E7C6E; --output:#237A32;
    --t-c:#777; --t-k:#9A5500; --t-b:#0F6A85; --t-f:#1F5FBF; --t-cl:#7A4E00; --t-d:#7A4E00; --t-t:#B00020; --t-a:#8A4513;
    --t-s:#1E6B2B; --t-n:#6B2FB0; --t-o:#555; font-size: 12px; }
  header { position: static; border: none; padding: 0 0 8px; } .tools, #legend, #offline, #toast, #nowbar, #strip, .rtb, .toscreen, .armbtn, .efirbtn, .phint, .ins,
  .blk > .tools, .sedit, #lessonsBtn, .pmin, #planlink, #planbanner, .blk.place { display: none !important; }
  #wrap { display: block; padding: 0; } nav#plan { position: static; max-height: none; overflow: visible; margin-bottom: 14px; }
  .stage { break-inside: auto; margin-bottom: 10px; } .stage .body, .stage.collapsed .body { display: block !important; }
  body.mode-prep .body { padding-left: 20px; } .prow .m { display: inline !important; }
  .stage.past.collapsed { opacity: 1; } .sh { break-after: avoid; break-inside: avoid; } .row { break-inside: avoid; }
  .bar { display: none !important; } .left { display: none; } figure img { max-height: 200px; } .blk.is-empty { display: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }    /* цвет плашек — на цветном принтере */
  html { zoom: 1 !important; }                 /* экранный «Размер текста» на бумагу не влияет — только «Мелко / Крупно» */
  nav#plan:not([hidden]) { display: block !important; position: static; box-shadow: none; }   /* план — и из «Урока» */
  body.print-size-small { zoom: .85; } body.print-size-large { zoom: 1.25; }
  body.print-no-answers .r-ask .ans { display: none !important; }
  body.print-no-code .blk[data-type=code] { display: none !important; }
  body.print-slides-big figure img { max-height: 120mm; } body.print-slides-thumbs figure img { max-height: 32mm; }
  body.print-slides-none .blk[data-type=image] { display: none !important; }
  .modal { display: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img src="/favicon.svg" alt="AutoPrintCode" width="36" height="36"></div>
    <div style="min-width:0">
      <div class="kicker" id="kicker">Экран урока · AutoPrintCode</div>
      <h1 id="title"><span id="titleText">Экран урока</span><button id="lessonsBtn" title="Другой урок или новый" aria-label="Список уроков" hidden><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button></h1>
      <button id="planlink" title="Открыть план: этапы и минуты для всех уроков по нему" hidden></button>
    </div>
  </div>
  <div class="tools" id="tools"></div>
  <div id="strip" aria-label="План урока строкой" hidden></div>
</header>
<section id="legend" hidden aria-label="Обозначения"><div class="grid" id="legendGrid"></div></section>
<section id="planbanner" hidden aria-label="План урока"></section>
<div id="wrap">
  <nav id="plan" aria-label="План урока" hidden></nav>
  <main id="main"><div class="hello">Подключаюсь к AutoPrintCode…</div></main>
</div>
<div id="viewer" hidden><img alt=""><div class="cap"></div></div>
<div id="toast" role="status" hidden></div>
<button id="nowbar" hidden></button>
<div id="offline" hidden>Нет связи с AutoPrintCode — переподключаюсь…</div>
<script type="module" src="/static/lesson/app.js"></script>
</body>
</html>
